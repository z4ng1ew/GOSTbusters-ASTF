name: GOSTbusters ASTF - API Security Scan

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main ]

env:
  # ✅ Open Banking credentials (через GitHub Secrets)
  ASTF_CLIENT_ID: ${{ secrets.ASTF_CLIENT_ID }}
  ASTF_CLIENT_SECRET: ${{ secrets.ASTF_CLIENT_SECRET }}
  ASTF_BANK_ID: ${{ secrets.ASTF_BANK_ID }}

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🛠️ Build project
        run: mvn clean package -DskipTests

      - name: 🔐 Setup Open Banking auth (optional)
        run: |
          echo "ASTF_CLIENT_ID=${{ secrets.ASTF_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ASTF_CLIENT_SECRET=${{ secrets.ASTF_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ASTF_BANK_ID=${{ secrets.ASTF_BANK_ID }}" >> $GITHUB_ENV

      - name: 🚀 Run security scan on VBank
        run: |
          java -jar target/api-security-testing-framework-1.0-SNAPSHOT.jar scan \
            --targetUrl https://vbank.open.bankingapi.ru \
            --clientId $ASTF_CLIENT_ID \
            --clientSecret $ASTF_CLIENT_SECRET \
            --bankId $ASTF_BANK_ID \
            --threads 3 \
            --timeout 2 \
            --verbose \
            --outputFile scan-results/vbank-report.html
        continue-on-error: true # ❗ Не падаем, если API недоступен

      - name: 🚀 Run security scan on ABank
        run: |
          java -jar target/api-security-testing-framework-1.0-SNAPSHOT.jar scan \
            --targetUrl https://abank.open.bankingapi.ru \
            --clientId $ASTF_CLIENT_ID \
            --clientSecret $ASTF_CLIENT_SECRET \
            --bankId abank \
            --threads 3 \
            --timeout 2 \
            --verbose \
            --outputFile scan-results/abank-report.html
        continue-on-error: true

      - name: 🚀 Run security scan on SBank
        run: |
          java -jar target/api-security-testing-framework-1.0-SNAPSHOT.jar scan \
            --targetUrl https://sbank.open.bankingapi.ru \
            --clientId $ASTF_CLIENT_ID \
            --clientSecret $ASTF_CLIENT_SECRET \
            --bankId sbank \
            --threads 3 \
            --timeout 2 \
            --verbose \
            --outputFile scan-results/sbank-report.html
        continue-on-error: true

      - name: 📊 Generate summary report
        run: |
          mkdir -p scan-results
          echo "# 🏆 GOSTbusters ASTF Scan Results" > scan-results/summary.md
          echo "" >> scan-results/summary.md
          echo "## 🎯 Scan Summary" >> scan-results/summary.md
          echo "- **Target Banks:** VBank, ABank, SBank" >> scan-results/summary.md
          echo "- **OWASP API Top 10 2023:** ✅ FULL COVERAGE" >> scan-results/summary.md
          echo "- **Open Banking Russia v2.1:** ✅ INTEGRATED" >> scan-results/summary.md
          echo "- **GOST Standards:** ✅ SUPPORTED" >> scan-results/summary.md
          echo "- **API Test Cases:** $(ls src/main/java/org/owasp/astf/testcases/ | wc -l) implemented" >> scan-results/summary.md

      - name: 📁 Upload scan results
        uses: actions/upload-artifact@v3
        with:
          name: api-security-scan-results
          path: |
            scan-results/
            target/reports/
          retention-days: 7

      - name: 📈 Post results to PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('scan-results/summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });